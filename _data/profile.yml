short_bio: >-
  <p>
    I am a PhD student at EPFL in the <a href="https://www.epfl.ch/labs/eceo/">Environmental Computational Science and Earth Observation Laboratory</a>.
    I develop and apply machine learning models to large-scale biodiversity data, with a particular focus on species distribution modeling.
    My research aims to improve our understanding of biodiversity patterns and how they may change in the future, ultimately supporting more effective conservation.
  </p>

  <p>
    Publications can be found on <a href="https://scholar.google.com/citations?user=pCOoHuAAAAAJ&hl=en">Google Scholar</a>.
  </p>

